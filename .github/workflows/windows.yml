name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore dependencies
        run: dotnet restore Halberion.Nexus.slnx --configfile NuGet.Config
      - name: Build
        run: dotnet build Halberion.Nexus.slnx -c Release --no-restore
      - name: Run Windows checks
        run: dotnet run --project tests/Halberion.Nexus.Tests.csproj -c Release --no-build
      - name: Publish standalone Windows x64 app
        run: .\scripts\package.ps1 -OutputDirectory .\artifacts\win-x64
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Halberion-Nexus-win-x64
          path: artifacts/win-x64/
